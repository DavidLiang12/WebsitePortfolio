<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM — Shareware</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font: 13px Tahoma, Arial, sans-serif; }
    #player { width: 100%; height: 100%; }
    #launcher { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; padding: 24px; text-align: center; background: #121212; }
    #launcher[hidden] { display: none; }
    h1 { margin: 0; font: 900 clamp(40px, 12vw, 80px)/1 Impact, 'Arial Black', sans-serif; color: #d9a12e; text-shadow: 3px 4px #79311e; letter-spacing: -3px; }
    p { margin: 0; line-height: 1.6; color: #c0c0c0; }
    button { justify-self: center; padding: 10px 28px; color: #000; background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; font: bold 13px Tahoma, Arial, sans-serif; cursor: pointer; }
    button:disabled { cursor: wait; color: #555; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    a { color: #c0c0c0; }
    small { font-size: 10px; color: #aaa; }
  </style>
</head>
<body>
  <div id="player" aria-label="DOOM game"></div>
  <div id="launcher">
    <h1>DOOM</h1>
    <p>Knee-Deep in the Dead<br>Shareware episode · 1993</p>
    <button type="button" id="play">Play DOOM</button>
    <p id="status" role="status">Arrows to move · Ctrl to fire · Space to open doors<br>Enter to select · Esc for the game menu</p>
    <small>DOOM © id Software · Powered by <a href="https://js-dos.com/" target="_blank" rel="noopener noreferrer">js-dos</a></small>
  </div>
  <script src="../js/doom-player.js?v=local-runtime-5"></script>
</body>
</html>
